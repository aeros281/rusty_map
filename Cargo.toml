[package]
name = "rusty_map"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rusty_map"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.11", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
httpmock = "0.7"
serde_json = "1"
